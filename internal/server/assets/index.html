<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>4D API Documentation</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #0f172a;
        color: #f8fafc;
      }
      #fallback {
        display: none;
        padding: 2rem;
        max-width: 900px;
        margin: 0 auto;
      }
      h1 { color: #38bdf8; }
      a { color: #38bdf8; text-decoration: none; }
      a:hover { text-decoration: underline; }
      pre {
        background: #1e293b;
        padding: 1rem;
        border-radius: 8px;
        overflow-x: auto;
      }
    </style>
  </head>
  <body>
    <noscript>
      <div style="padding: 2rem;">JavaScript is required to render interactive API documentation.</div>
    </noscript>

    <!-- Scalar API Reference (Modern, high performance OpenAPI viewer) -->
    <script
      id="api-reference"
      data-url="/openapi.json">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference" onerror="document.getElementById('fallback').style.display='block';"></script>

    <div id="fallback">
      <h1>4D OpenAPI Interactive Documentation</h1>
      <p>The interactive reference viewer failed to load from CDN. You can access the raw specifications directly:</p>
      <ul>
        <li><a href="/openapi.yaml" target="_blank">Download openapi.yaml</a></li>
        <li><a href="/openapi.json" target="_blank">Download openapi.json</a></li>
        <li><a href="/health" target="_blank">Check Service Health</a></li>
      </ul>
    </div>
  </body>
</html>
